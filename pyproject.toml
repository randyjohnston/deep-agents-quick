[project]
name = "deep-agents-quick"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.4",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.3",
    "langchain-ollama>=1.1.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.27",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Modules live at the repo root (agent.py, xlsx.py), not in a src/ package.
pythonpath = ["."]
testpaths = ["tests"]
